# Modern Kubernetes Gateway API: GatewayClass + Gateway + HTTPRoute ile Canary Trafik Bolme (%80 v1, %20 v2)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external-gateway
  namespace: production
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: company-wildcard-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: order-service-canary-route
  namespace: production
spec:
  parentRefs:
    - name: external-gateway
  hostnames:
    - "api.company.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/orders
      backendRefs:
        - name: order-service-v1
          port: 80
          weight: 80 # Trafiğin %80'i stabil surume
        - name: order-service-v2
          port: 80
          weight: 20 # Trafiğin %20'si yeni Canary surume