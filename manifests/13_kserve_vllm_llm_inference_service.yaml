# KServe vLLM ile Llama-3 / DeepSeek LLM Model Sunumu (GPU Ivmesi ve Canary Destekli)
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llama-3-8b-instruct
  namespace: ai-inference
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 5
    model:
      modelFormat:
        name: vLLM
      storageUri: "s3://company-ml-models/llama-3-8b-instruct/"
      resources:
        requests:
          cpu: "4"
          memory: "16Gi"
          nvidia.com/gpu: "1" # 1 Adet A10G veya L4 GPU
        limits:
          cpu: "8"
          memory: "32Gi"
          nvidia.com/gpu: "1"
      args:
        - "--model=/mnt/models"
        - "--tensor-parallel-size=1"
        - "--max-model-len=8192"
        - "--gpu-memory-utilization=0.90"