# CKA ve CKS Sertifikasyon Sinavlarinda En Cok Cikan Sablonlar (Multi-Container + NetworkPolicy + RBAC)
apiVersion: v1
kind: Pod
metadata:
  name: cka-multi-container-pod
  namespace: default
  labels:
    tier: backend
    app: secure-app
spec:
  serviceAccountName: cka-exam-sa
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: app-container
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/nginx
    - name: sidecar-logger
      image: busybox:1.36
      command: ["/bin/sh", "-c", "tail -n+1 -f /var/log/nginx/access.log"]
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/nginx
  volumes:
    - name: shared-logs
      emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cka-allow-ingress-backend
  namespace: default
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: frontend
      ports:
        - protocol: TCP
          port: 80