# KubeRay RayCluster (Dagitik Model Egitimi) ve NVIDIA GPU Time-Slicing Pod Sablonu
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-ml-cluster
  namespace: ai-workloads
spec:
  rayVersion: '2.35.0'
  headGroupSpec:
    rayStartParams:
      dashboard-host: '0.0.0.0'
    template:
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray-ml:2.35.0-py310-gpu
            resources:
              requests:
                cpu: "2"
                memory: "8Gi"
  workerGroupSpecs:
    - groupName: gpu-workers
      replicas: 2
      minReplicas: 1
      maxReplicas: 8
      template:
        spec:
          containers:
            - name: ray-worker
              image: rayproject/ray-ml:2.35.0-py310-gpu
              resources:
                limits:
                  nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-time-slice-pytorch-pod
  namespace: ai-workloads
spec:
  containers:
    - name: pytorch-inference
      image: pytorch/pytorch:2.4.0-cuda12.4-cudnn9-runtime
      command: ["python", "-c", "import torch; print('CUDA Ready:', torch.cuda.is_available())"]
      resources:
        limits:
          nvidia.com/gpu: "1" # Time-slicing ile 1 GPU birden fazla pod tarafindan paylasilir