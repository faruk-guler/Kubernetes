# Yuksek Kullanilabilirlik ve Cok Kiracili Kaynak Guvencesi: PDB + Quota + LimitRange + APF
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-api-pdb
  namespace: production
spec:
  minAvailable: 80% # Bakim, drain veya node upgrade sirasinda en az %80 pod daima ayakta kalmali
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: production-tenant-quota
  namespace: production
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    pods: "50"
    services.loadbalancers: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: production-limit-range
  namespace: production
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 4000m
        memory: 8Gi