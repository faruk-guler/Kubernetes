# Cluster API (CAPI) ile Deklaratif Kubernetes Kumesi ve Düğüm Havuzu Yonetimi
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: prod-frankfurt-01
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["10.244.0.0/16"]
    services:
      cidrBlocks: ["10.96.0.0/12"]
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: prod-frankfurt-01-control-plane
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: AWSCluster
    name: prod-frankfurt-01
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineHealthCheck
metadata:
  name: prod-frankfurt-node-healer
  namespace: default
spec:
  clusterName: prod-frankfurt-01
  selector:
    matchLabels:
      role: worker
  unhealthyConditions:
    - type: Ready
      status: "False"
      timeout: 300s
    - type: Ready
      status: "Unknown"
      timeout: 300s
  remediationTemplate:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: AWSMachineTemplate
    name: prod-frankfurt-worker-remediation