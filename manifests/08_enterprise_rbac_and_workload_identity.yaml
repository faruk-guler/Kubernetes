# Kurumsal RBAC Matrisi: ClusterRole, Role, RoleBinding ve AWS IAM Workload Identity ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-processor-sa
  namespace: production
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/PaymentsS3AndDynamoAccessRole
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: application-operator-role
  namespace: production
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-application-operator
  namespace: production
subjects:
  - kind: ServiceAccount
    name: payments-processor-sa
    namespace: production
roleRef:
  kind: Role
  name: application-operator-role
  apiGroup: rbac.authorization.k8s.io