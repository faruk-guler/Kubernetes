# Karmada Coklu Kume Is Yuku Yayma Politikasi (PropagationPolicy) ve Sanal Kume (vCluster)
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: global-api-propagation
  namespace: production
spec:
  resourceSelectors:
    - apiVersion: apps/v1
      kind: Deployment
      name: payment-service
  placement:
    clusterAffinity:
      clusterNames:
        - cluster-eu-central
        - cluster-us-east
        - cluster-ap-southeast
    replicaScheduling:
      replicaSchedulingType: Divided
      replicaDivisionPreference: Weighted
      weightPreference:
        staticWeightList:
          - targetCluster:
              clusterNames: [cluster-eu-central]
            weight: 50
          - targetCluster:
              clusterNames: [cluster-us-east]
            weight: 30
          - targetCluster:
              clusterNames: [cluster-ap-southeast]
            weight: 20
---
# Sanal Kubernetes Kumesi (vCluster) Yapilandirma Degerleri (vcluster.yaml)
apiVersion: v1
kind: ConfigMap
metadata:
  name: vcluster-isolated-dev
  namespace: team-alpha
data:
  values.yaml: |
    syncer:
      extraArgs:
        - --sync=ingresses,services,configmaps,secrets
    isolation:
      enabled: true
      podSecurityStandard: restricted