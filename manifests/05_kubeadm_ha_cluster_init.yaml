# Kubeadm v1.32+ Cok Dugumlu ve Yuksek Kullanilabilirlikli (HA) Kume Baslatma Yapilandirmasi
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: "192.168.1.10"
  bindPort: 6443
nodeRegistration:
  criSocket: "unix:///run/containerd/containerd.sock"
  imagePullPolicy: "IfNotPresent"
  taints:
    - key: "node-role.kubernetes.io/control-plane"
      effect: "NoSchedule"
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: "v1.32.1"
clusterName: "production-cluster"
controlPlaneEndpoint: "k8s-api.company.internal:6443"
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
  dnsDomain: "cluster.local"
apiServer:
  certSANs:
    - "k8s-api.company.internal"
    - "192.168.1.10"
    - "192.168.1.11"
    - "192.168.1.12"
    - "127.0.0.1"
  extraArgs:
    - name: "anonymous-auth"
      value: "false"
    - name: "audit-log-path"
      value: "/var/log/kubernetes/audit.log"
controllerManager:
  extraArgs:
    - name: "bind-address"
      value: "0.0.0.0"
scheduler:
  extraArgs:
    - name: "bind-address"
      value: "0.0.0.0"