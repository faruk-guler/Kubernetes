# Coklu Kume, Kullanici ve Baglam (Context) Yonetimi Icin Ornek Kubeconfig Sablonu
apiVersion: v1
kind: Config
preferences: {}
current-context: dev-cluster-admin

clusters:
  - name: production-cluster
    cluster:
      server: https://k8s-api.company.internal:6443
      certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCg==
  - name: dev-cluster
    cluster:
      server: https://127.0.0.1:6443
      insecure-skip-tls-verify: false
      certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCg==

users:
  - name: developer-user
    user:
      client-certificate-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCg==
      client-key-data: LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktLS0tLQo=
  - name: devops-oidc-user
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: kubelogin
        args:
          - get-token
          - --oidc-issuer-url=https://auth.company.internal
          - --oidc-client-id=kubernetes

contexts:
  - name: dev-cluster-admin
    context:
      cluster: dev-cluster
      user: developer-user
      namespace: default
  - name: prod-cluster-readonly
    context:
      cluster: production-cluster
      user: devops-oidc-user
      namespace: monitoring