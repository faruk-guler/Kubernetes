# Flagger Canary Kaynağı: Otomatik Metrik Doğrulama ve Kendi Kendini Geri Alma (Self-Healing Rollback)
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: order-api-canary
  namespace: production
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-api
  service:
    port: 80
    targetPort: 8080
    gateways:
      - mesh
      - production/external-gateway
    hosts:
      - orders.company.internal
  analysis:
    interval: 30s
    threshold: 3 # 3 ardışık hata durumunda hemen rollback yap
    maxWeight: 50
    stepWeight: 10
    metrics:
      - name: request-success-rate
        thresholdRange:
          min: 99.5 # HTTP 2xx/3xx başarı oranı minimum %99.5 olmalı
        interval: 30s
      - name: request-duration
        thresholdRange:
          max: 300 # Milisaniye cinsinden p99 yanıt süresi tavanı
        interval: 30s
    webhooks:
      - name: load-test-generator
        type: rollout
        url: http://flagger-loadtester.testing/
        timeout: 5s
        metadata:
          cmd: "hey -z 1m -q 10 -c 2 http://order-api-canary.production:80/"
