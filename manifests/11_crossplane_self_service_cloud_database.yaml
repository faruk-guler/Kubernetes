# Crossplane ile K8s Uzerinden Self-Service Bulut Veritabani (AWS RDS PostgreSQL) Saglama
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xpostgresqlinstances.database.company.com
spec:
  group: database.company.com
  names:
    kind: XPostgreSQLInstance
    plural: xpostgresqlinstances
  claimNames:
    kind: PostgreSQLInstance
    plural: postgresqlinstances
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    storageGB:
                      type: integer
                    tier:
                      type: string
---
apiVersion: database.company.com/v1alpha1
kind: PostgreSQLInstance
metadata:
  name: billing-db-claim
  namespace: production
spec:
  parameters:
    storageGB: 50
    tier: "db.r6g.large"
  writeConnectionSecretToRef:
    name: billing-db-conn-secret