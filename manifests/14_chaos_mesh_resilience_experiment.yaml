# Kaos Muhendisligi (Chaos Mesh): 200ms Gecikme ve %10 Paket Kaybi Simule Eden Dayaniklilik Deneyi
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: payment-service-latency-test
  namespace: production
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - production
    labelSelectors:
      app.kubernetes.io/name: payment-service
  delay:
    latency: "200ms"
    jitter: "20ms"
    correlation: "50"
  loss:
    loss: "10"
    correlation: "25"
  duration: "10m" # Deney 10 dakika sonra otomatik dursun
  scheduler:
    cron: "0 14 * * 2" # Her Sali saat 14:00'da kaos testi calistir