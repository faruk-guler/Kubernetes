# Modern K8s v1.30+ CEL Tabanli ValidatingAdmissionPolicy ve Kyverno Guvenlik Kurallari
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: enforce-production-standards
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: "object.spec.replicas >= 2"
      message: "Uretim ortaminda tek replica Deployment olusturulamaz (En az 2 replica zorunludur)."
    - expression: "'owner' in object.metadata.labels"
      message: "Tum Deployment nesnelerinde zorunlu 'owner' etiketi bulunmalidir."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bind-production-standards
spec:
  policyName: enforce-production-standards
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        environment: production
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-user
spec:
  validationFailureAction: Enforce
  rules:
    - name: check-run-as-non-root
      match:
        any:
          - resources:
              kinds: ["Pod"]
      validate:
        message: "Konteynerlerin root (UID 0) kullanicisiyla calismasi kesinlikle yasaktir."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true