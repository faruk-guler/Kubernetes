# Otomatik Let's Encrypt TLS ve Hiz Sinirlamali (Rate Limit) Ingress-NGINX ve Backend Servisi
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store-ingress
  namespace: production
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "store.company.com"
      secretName: store-tls-cert
  rules:
    - host: "store.company.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: store-frontend-service
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: store-frontend-service
  namespace: production
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: store-frontend